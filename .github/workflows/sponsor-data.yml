# Refreshes the search data behind uk-visa-sponsors.html and canada-lmia-employers.html
# from the two official sources (GOV.UK register of licensed sponsors, Canada positive LMIA list).
# It changes files under data/, the pages built from that data (uk-visa-sponsors-*.html,
# canada-lmia-employers-*.html, the browse block on the two hub pages) and their sitemap lines.
# It never edits any other page, design or text.
# Runs on the 1st of every month, or manually from Actions > Sponsor data > Run workflow.
name: Sponsor data
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data from the official files
        run: |
          pip install -q openpyxl
          python3 tools/build_sponsor_data.py
      - name: Rebuild the city, province and job pages from the data
        run: python3 tools/build_sponsor_pages.py
      - name: Commit data and its pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data uk-visa-sponsors*.html canada-lmia-employers*.html sitemap.xml
          if git diff --cached --quiet; then echo "No change in the official data"; exit 0; fi
          git commit -q -m "Sponsor data and pages: monthly refresh from GOV.UK and Open Canada"
          git push
          du -sh data
