name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o page.html -w "%{http_code} %{size_download}\n" -L --max-time 60 https://www.dol.gov/agencies/eta/foreign-labor/performance || true
          grep -o 'href="[^"]*LCA[^"]*"' page.html | head -20 || true
          f=$(grep -o 'href="[^"]*LCA_Disclosure_Data[^"]*xlsx"' page.html | head -1 | sed 's/href="//;s/"$//')
          case "$f" in /*) f="https://www.dol.gov$f";; esac
          echo "FILE $f"
          curl -sS -o lca.xlsx -w "%{http_code} %{size_download} %{time_total}\n" -L --max-time 600 "$f" || true
          ls -la lca.xlsx; file lca.xlsx
          pip install -q openpyxl
          python3 - <<'PY'
          import openpyxl, collections, time
          t=time.time()
          wb=openpyxl.load_workbook('lca.xlsx', read_only=True)
          ws=wb[wb.sheetnames[0]]
          it=ws.iter_rows(values_only=True)
          head=next(it); print(len(head)); print(head)
          n=0; c=collections.Counter(); st=collections.Counter(); vc=collections.Counter()
          ix={h:i for i,h in enumerate(head)}
          for r in it:
              n+=1
              if n<=2: print(r)
              st[r[ix['CASE_STATUS']]]+=1; vc[r[ix['VISA_CLASS']]]+=1
              c[r[ix['EMPLOYER_NAME']]]+=1
          print(n, st.most_common(), vc.most_common(), len(c), c.most_common(5), round(time.time()-t))
          PY
