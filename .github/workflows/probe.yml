name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          echo "== page"; curl -sS -o page.html -w "%{http_code} %{size_download}\n" -A "$UA" -L --max-time 60 https://www.dol.gov/agencies/eta/foreign-labor/performance || true
          grep -o 'href="[^"]*LCA_Disclosure[^"]*"' page.html | head -12 || true
          grep -o 'href="[^"]*LCA[^"]*Record_Layout[^"]*"' page.html | head -4 || true
          for q in FY2026_Q3 FY2026_Q4 FY2026_Q2; do
            echo "== $q"; curl -sS -I -A "$UA" -L --max-time 60 "https://www.dol.gov/sites/dolgov/files/ETA/oflc/pdfs/LCA_Disclosure_Data_$q.xlsx" | grep -i -E "^HTTP|content-length|content-type" || true
          done
          echo "== plain UA"; curl -sS -o /dev/null -w "%{http_code}\n" -L --max-time 60 https://www.dol.gov/agencies/eta/foreign-labor/performance || true
