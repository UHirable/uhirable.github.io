<style type="text/css"> #pnp-565 .pnp-jobs-content {

        background  : #FFFFFF;
        border      : 1px solid #DDDDDD;

    #pnp-565 .pnp-searchbox-wrapper label {
        font-size    : 12px;

        text-align   : left;
        margin-right : 5px;

        font-size : 11px;
        padding   : 0 2px;

    }

        padding-top : 5px;

<div id="pnp-565" class="pnp-jobswidget-wrapper" data-id="565">
